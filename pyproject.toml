[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowbatt"
version = "0.1.0"
description = "Flow matching for probabilistic battery degradation prediction"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "FlowBatt contributors"}]
dependencies = [
  "torch>=2.2,<3", "torchvision>=0.17",
  "diffusers>=0.30,<0.36", "flow_matching==1.0.10", "torchdiffeq==0.2.5",
  "timm>=1.0.12,<1.1", "numpy>=1.26,<3", "scipy>=1.11,<2",
  "scikit-learn>=1.4,<1.9", "tqdm>=4.66,<5",
  "matplotlib>=3.8,<4"
]

[project.scripts]
flowbatt-train = "flowbatt.train:main"
flowbatt-evaluate = "flowbatt.evaluate:main"

[project.urls]
Repository = "https://github.com/HamidrezaEiv/FlowBatt"

[tool.setuptools.packages.find]
where = ["."]
include = ["flowbatt*"]
